name: Build Tulpar kernel

on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"

jobs:
  tulpar-build:
    runs-on: ubuntu-latest
    env:
      V_C_ERROR_BUG_REPORT_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install build-essential clang -y

      - name: Build the pinned V
        run: |
          git clone https://github.com/vlang/v v
          git -C v checkout f7e9ee96c22ca6db47b56d28332e7553715c659f
          make -C v

      # Userland utilities use the release compiler's libc bindings. The
      # kernel compiler is pinned separately for its freestanding backend.
      - name: Fetch the pinned utility compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/vlang/v/releases/download/0.5.2/v_linux.zip \
            -o "$RUNNER_TEMP/v_util_linux.zip"
          echo "86caf9e70c3342d48ef19eb4f6c47b709f18c90ae86255520d5c29df6b482e23  $RUNNER_TEMP/v_util_linux.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/v-util"
          unzip -q "$RUNNER_TEMP/v_util_linux.zip" -d "$RUNNER_TEMP/v-util"
          chmod +x "$RUNNER_TEMP/v-util/v/v"
          "$RUNNER_TEMP/v-util/v/v" version

      - name: Download kernel dependencies
        run: cd kernel && ./get-deps

      - name: Attempt to build the Tulpar kernel (debug)
        run: |
          set -e
          cd kernel
          make PROD=false \
            CFLAGS="-Ulinux -U__linux -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe" \
            V="$(realpath ../v/v)"
          make clean

      - name: Attempt to build the Tulpar kernel (prod)
        run: |
          set -e
          cd kernel
          make PROD=true \
            CFLAGS="-Ulinux -U__linux -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe" \
            V="$(realpath ../v/v)"
          make clean

      - name: Attempt to build the util-tulpar (debug)
        run: |
          set -e
          export VEXE="$RUNNER_TEMP/v-util/v/v"
          cd util-tulpar
          make PROD=false \
            VFLAGS="-os vinix -gc none" \
            CFLAGS="-Ulinux -U__linux -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe" \
            V="$VEXE"
          make clean

      - name: Attempt to build the util-tulpar (prod)
        run: |
          set -e
          export VEXE="$RUNNER_TEMP/v-util/v/v"
          cd util-tulpar
          make PROD=true \
            VFLAGS="-os vinix -gc none" \
            CFLAGS="-Ulinux -U__linux -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe" \
            V="$VEXE"
          make clean
