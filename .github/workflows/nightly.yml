name: Tulpar terminal images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
permissions:
  contents: read
env:
  V_COMMIT: f7e9ee96c22ca6db47b56d28332e7553715c659f
jobs:
  terminal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - name: Install build and QEMU dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang llvm lld git curl file rsync xorriso xz-utils mtools libarchive-dev qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64
      - name: Build the pinned V compiler
        run: |
          git clone https://github.com/vlang/v "$RUNNER_TEMP/v"
          git -C "$RUNNER_TEMP/v" checkout "$V_COMMIT"
          make -C "$RUNNER_TEMP/v"
          echo "V=$RUNNER_TEMP/v/v" >> "$GITHUB_ENV"
      - name: Build and test the terminal OS
        run: make ARCH=${{ matrix.arch }} test-terminal STATE_DIR="$RUNNER_TEMP/tulpar-evidence"
      - name: Upload terminal image
        uses: actions/upload-artifact@v4
        with:
          name: tulpar-${{ matrix.arch }}
          path: tulpar-${{ matrix.arch }}.iso
          if-no-files-found: error
      - name: Upload QEMU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-evidence-${{ matrix.arch }}
          path: ${{ runner.temp }}/tulpar-evidence/
